<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gids delen – Visser Inspecties</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#432d6a">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,300;0,400;0,700;0,900;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#432d6a; --lila:#8e81a6; --lila-soft:#e8e6ed;
  --bg:#f4f2f6; --card:#fff; --ink:#1d1833; --muted:#6b6584; --line:#d9d5e1; --accent:#432d6a;
  --wa:#1f8f4e; --serif:'Merriweather',Georgia,'Times New Roman',serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#14112a; --card:#1e1a3a; --ink:#efeaff; --muted:#a79fc4; --line:#352f58; --lila-soft:#2a2450; --accent:#b7a9ff}}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:var(--serif);background:var(--bg);color:var(--ink);min-height:100vh;line-height:1.5;
  padding:0 env(safe-area-inset-right) 0 env(safe-area-inset-left)}
.band{background:var(--brand);padding:calc(env(safe-area-inset-top) + 14px) 16px 16px;display:flex;align-items:center;gap:12px}
.band a{color:#fff;text-decoration:none;font-size:22px;line-height:1;padding:4px 8px 4px 0}
.band h1{color:#fff;font-size:17px;font-weight:700}
.labelstreep{height:5px;background:linear-gradient(90deg,#019541 0 16.6%,#54ae32 0 33.3%,#c6d500 0 50%,#ffee02 0 66.6%,#faba00 0 83.3%,#ec670a 0)}
main{max-width:520px;margin:0 auto;padding:18px 16px calc(env(safe-area-inset-bottom) + 28px)}
.gids{display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:18px}
.gids img{width:74px;height:auto;border-radius:4px;box-shadow:0 1px 4px rgba(0,0,0,.18);flex:none}
.gids b{display:block;font-size:15.5px}
.gids span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.gids a{display:inline-block;margin-top:6px;font-size:12.5px;color:var(--accent);font-weight:700;text-decoration:none}
h2{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:4px 4px 8px}
.veld{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px 14px;margin-bottom:18px}
label{display:block;padding:10px 0;border-bottom:1px solid var(--line)}
label:last-child{border-bottom:none}
label small{display:block;font-size:11.5px;color:var(--muted);margin-bottom:3px}
input,textarea{width:100%;border:none;background:transparent;font-family:var(--serif);font-size:15px;color:var(--ink);outline:none}
textarea{font-size:13px;line-height:1.55;resize:vertical;min-height:120px}
.knoppen{display:flex;flex-direction:column;gap:10px;margin-bottom:22px}
button{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border:none;border-radius:14px;padding:15px 16px;
  font-family:var(--serif);font-size:15.5px;font-weight:700;color:#fff;background:var(--brand);cursor:pointer}
button.wa{background:var(--wa)}
button.licht{background:var(--card);color:var(--accent);border:1px solid var(--line);font-size:14px;padding:12px}
button:active{transform:scale(.98)}
button svg{width:20px;height:20px;flex:none}
details{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px 14px;margin-bottom:12px}
summary{padding:10px 0;font-size:13.5px;font-weight:700;color:var(--accent);cursor:pointer;list-style:none}
summary::-webkit-details-marker{display:none}
summary::after{content:'›';float:right;color:var(--lila);font-size:18px;transition:transform .15s}
details[open] summary::after{transform:rotate(90deg)}
details textarea{border-top:1px solid var(--line);padding:10px 0}
.reset{display:block;margin:2px 0 10px;font-size:11.5px;color:var(--muted);background:none;border:none;text-decoration:underline;cursor:pointer;padding:0;width:auto}
#melding{min-height:20px;text-align:center;font-size:12.5px;color:var(--muted);margin-top:4px}
</style>
<script src="assets/home-knop.js" defer></script>
</head>
<body>

<div class="band"><a href="index.html" aria-label="Terug">‹</a><h1>Gids delen</h1></div>
<div class="labelstreep"></div>

<main>
  <div class="gids">
    <img src="gidsen/isoleren-met-verstand-omslag.jpg" alt="Omslag Isoleren met verstand">
    <div>
      <b>Isoleren met verstand</b>
      <span>Praktische gids over dak-, gevel- en vloerisolatie · oktober 2026</span>
      <a href="gidsen/isoleren-met-verstand.pdf" target="_blank" rel="noopener">Gids bekijken ›</a>
    </div>
  </div>

  <h2>Voor wie?</h2>
  <div class="veld">
    <label><small>Naam (voor de aanhef, mag leeg)</small><input id="naam" autocomplete="off" placeholder="bijv. mevrouw De Vries"></label>
    <label><small>E-mailadres (mag leeg)</small><input id="mail" type="email" autocomplete="off" inputmode="email" placeholder="naam@voorbeeld.nl"></label>
    <label><small>Mobiel nummer voor WhatsApp (mag leeg)</small><input id="tel" type="tel" autocomplete="off" inputmode="tel" placeholder="06 12345678"></label>
  </div>

  <div class="knoppen">
    <button id="btnMail">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
      Concept-e-mail maken
    </button>
    <button id="btnWa" class="wa">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.7.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.2-.4.7-1.4a.5.5 0 0 0 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6a2.7 2.7 0 0 0 1.8-1.2 2.2 2.2 0 0 0 .1-1.2c0-.1-.2-.2-.5-.3z"/></svg>
      Delen via WhatsApp
    </button>
    <button id="btnKopie" class="licht">Tekst en link kopiëren</button>
    <div id="melding"></div>
  </div>

  <h2>Tekst controleren</h2>
  <details>
    <summary>E-mail</summary>
    <label><small>Onderwerp</small><input id="onderwerp"></label>
    <textarea id="tekstMail" rows="12"></textarea>
    <button class="reset" data-reset="mail">Standaardtekst terugzetten</button>
  </details>
  <details>
    <summary>WhatsApp</summary>
    <textarea id="tekstWa" rows="9"></textarea>
    <button class="reset" data-reset="wa">Standaardtekst terugzetten</button>
  </details>
</main>

<script>
/* Link naar de gids: altijd de openbare GitHub Pages-versie, zodat de ontvanger hem kan openen */
const LINK = 'https://visserinspecties.github.io/foto-upload/gidsen/isoleren-met-verstand.pdf';
const ONDERWERP = 'Gids ‘Isoleren met verstand’';
const $ = id => document.getElementById(id);

function aanhef(){ const n = $('naam').value.trim(); return n ? `Beste ${n},` : 'Goedendag,'; }

function standaardMail(){
  return `${aanhef()}

Hierbij ontvangt u de gids ‘Isoleren met verstand’. Daarin leest u welke delen van uw woning u kunt isoleren, waar u op moet letten en welke vragen u uw aannemer kunt stellen.

U kunt de gids hier bekijken en downloaden:
${LINK}

Deze gids wordt u aangeboden door Visser Inspecties – visserinspecties.nl.

Met vriendelijke groet,
`;
}
function standaardWa(){
  return `${aanhef()}

Hierbij de gids ‘Isoleren met verstand’, met uitleg over het isoleren van dak, gevel en vloer en waar u op moet letten:
${LINK}

Aangeboden door Visser Inspecties – visserinspecties.nl
John Visser`;
}

/* Teksten volgen de naam automatisch, tot je ze zelf aanpast */
let eigenMail = false, eigenWa = false;
function vul(){
  if(!eigenMail) $('tekstMail').value = standaardMail();
  if(!eigenWa) $('tekstWa').value = standaardWa();
}
$('onderwerp').value = ONDERWERP;
vul();
$('naam').addEventListener('input', vul);
$('tekstMail').addEventListener('input', () => eigenMail = true);
$('tekstWa').addEventListener('input', () => eigenWa = true);
document.querySelectorAll('.reset').forEach(b => b.addEventListener('click', () => {
  if(b.dataset.reset === 'mail'){ eigenMail = false; $('onderwerp').value = ONDERWERP; }
  else eigenWa = false;
  vul();
}));

function melding(t){ $('melding').textContent = t; clearTimeout(melding.t); melding.t = setTimeout(() => $('melding').textContent = '', 6000); }

/* E-mail: opent een nieuw bericht (concept) in je standaard mailprogramma, zoals Outlook */
$('btnMail').addEventListener('click', () => {
  const aan = $('mail').value.trim();
  const url = 'mailto:' + encodeURIComponent(aan)
    + '?subject=' + encodeURIComponent($('onderwerp').value)
    + '&body=' + encodeURIComponent($('tekstMail').value);
  location.href = url;
  melding('Het concept opent in je mailprogramma. Voeg je handtekening toe en verstuur.');
});

/* WhatsApp: met nummer direct naar dat gesprek, zonder nummer kies je zelf het contact */
function waNummer(t){
  let n = t.replace(/[^\d+]/g, '');
  if(n.startsWith('+')) n = n.slice(1);
  else if(n.startsWith('00')) n = n.slice(2);
  else if(n.startsWith('0')) n = '31' + n.slice(1);
  return n;
}
$('btnWa').addEventListener('click', () => {
  const nr = waNummer($('tel').value.trim());
  const url = 'https://wa.me/' + (nr.length >= 10 ? nr : '') + '?text=' + encodeURIComponent($('tekstWa').value);
  window.open(url, '_blank');
  melding(nr.length >= 10 ? 'WhatsApp opent met het bericht klaar.' : 'Kies in WhatsApp het contact; het bericht staat klaar.');
});

$('btnKopie').addEventListener('click', async () => {
  try{ await navigator.clipboard.writeText($('tekstWa').value); melding('Tekst met link gekopieerd.'); }
  catch(e){ melding('Kopiëren lukte niet; selecteer de tekst hieronder handmatig.'); }
});
</script>
</body>
</html>
